<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1530"/><stop offset="1" stop-color="#132a5c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.35" r="0.5">
      <stop offset="0" stop-color="#3370ff" stop-opacity="0.35"/><stop offset="1" stop-color="#3370ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Chat column: three bubbles -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20">
    <g transform="translate(80 70)">
      <rect width="380" height="72" rx="18" fill="#1b2d5e" stroke="#2d4a8f"/>
      <text x="24" y="30" fill="#c7d2fe" font-size="15">橘 · 10:42</text>
      <text x="24" y="56" fill="#ffffff">读一下这篇文档并总结</text>
    </g>
    <g transform="translate(140 160)">
      <rect width="440" height="110" rx="18" fill="#3370ff"/>
      <circle cx="30" cy="30" r="10" fill="#ffffff" fill-opacity="0.9"/>
      <text x="50" y="36" fill="#ffffff" font-size="15">Claude 助手</text>
      <text x="24" y="70" fill="#ffffff">Summary posted to the group.</text>
      <text x="24" y="96" fill="#dbe4ff" font-size="16">Doc linked · 3 tasks created</text>
    </g>
    <g transform="translate(80 290)">
      <rect width="300" height="60" rx="18" fill="#1b2d5e" stroke="#2d4a8f"/>
      <text x="24" y="38" fill="#ffffff">谢谢 👍</text>
    </g>
  </g>

  <!-- Bitable card -->
  <g transform="translate(700 70)">
    <rect width="500" height="250" rx="14" fill="#0e1c3f" stroke="#2d4a8f"/>
    <rect width="500" height="44" rx="14" fill="#1b2d5e"/>
    <rect y="30" width="500" height="14" fill="#1b2d5e"/>
    <text x="20" y="29" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#c7d2fe" letter-spacing="1">君君｜选题库 · Bitable</text>
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#e2e8f0">
      <g stroke="#243a6e"><line x1="0" y1="90" x2="500" y2="90"/><line x1="0" y1="136" x2="500" y2="136"/><line x1="0" y1="182" x2="500" y2="182"/><line x1="170" y1="44" x2="170" y2="250"/><line x1="330" y1="44" x2="330" y2="250"/></g>
      <text x="20" y="72" fill="#94a3b8">选题</text><text x="190" y="72" fill="#94a3b8">状态</text><text x="350" y="72" fill="#94a3b8">发布日</text>
      <text x="20" y="118">问题肌管理</text><rect x="190" y="101" width="72" height="24" rx="12" fill="#22c55e" fill-opacity="0.25"/><text x="204" y="118" fill="#86efac">已发布</text><text x="350" y="118">09-02</text>
      <text x="20" y="164">秋季护肤</text><rect x="190" y="147" width="72" height="24" rx="12" fill="#f59e0b" fill-opacity="0.25"/><text x="204" y="164" fill="#fcd34d">进行中</text><text x="350" y="164">09-10</text>
      <text x="20" y="210">直播复盘</text><rect x="190" y="193" width="72" height="24" rx="12" fill="#3370ff" fill-opacity="0.35"/><text x="204" y="210" fill="#bfdbfe">待办</text><text x="350" y="210">—</text>
    </g>
  </g>

  <!-- Doc card -->
  <g transform="translate(760 350)">
    <rect width="300" height="170" rx="14" fill="#0e1c3f" stroke="#2d4a8f"/>
    <rect x="20" y="22" width="150" height="12" rx="6" fill="#c7d2fe"/>
    <rect x="20" y="52" width="260" height="8" rx="4" fill="#3b4f86"/>
    <rect x="20" y="70" width="240" height="8" rx="4" fill="#3b4f86"/>
    <rect x="20" y="88" width="255" height="8" rx="4" fill="#3b4f86"/>
    <rect x="20" y="118" width="110" height="8" rx="4" fill="#3370ff"/>
    <rect x="20" y="136" width="200" height="8" rx="4" fill="#3b4f86"/>
  </g>

  <!-- Plug glyph -->
  <g transform="translate(1100 380)" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M40 40 v40 M100 40 v40"/>
    <path d="M20 80 h100 v20 a50 50 0 0 1 -100 0 z"/>
    <path d="M70 150 v40"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="620" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Feishu MCP</text>
    <text x="64" y="670" font-size="22" fill="#b3b7c2" letter-spacing="4">CHAT · DOCS · BITABLE · TASKS, DRIVEN BY CLAUDE</text>
  </g>
</svg>
