<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141110"/><stop offset="1" stop-color="#1e1916"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a3d2f"/><stop offset="0.5" stop-color="#3f5c46"/><stop offset="1" stop-color="#22312a"/>
    </linearGradient>
    <linearGradient id="bottle2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b2a2a"/><stop offset="0.5" stop-color="#5a3d3d"/><stop offset="1" stop-color="#2e2020"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Big kanji watermark -->
  <text x="1180" y="420" font-family="Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" font-size="420" fill="#c9a961" fill-opacity="0.08" text-anchor="end">酒</text>

  <!-- Bottles -->
  <g transform="translate(120 90)">
    <!-- bottle 1 -->
    <g>
      <rect x="44" y="0" width="32" height="40" rx="4" fill="#1b1613"/>
      <rect x="40" y="36" width="40" height="20" rx="3" fill="#c9a961"/>
      <path d="M40 56 C 20 90, 12 120, 12 160 L12 400 Q12 416 28 416 L92 416 Q108 416 108 400 L108 160 C108 120, 100 90, 80 56 Z" fill="url(#bottle)"/>
      <rect x="26" y="200" width="68" height="120" rx="3" fill="#f3ead9"/>
      <text x="60" y="290" font-family="Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" font-size="30" fill="#1b1613" text-anchor="middle" writing-mode="tb" glyph-orientation-vertical="0">獺祭</text>
      <rect x="26" y="330" width="68" height="14" fill="#a83232"/>
    </g>
    <!-- bottle 2 -->
    <g transform="translate(150 60)">
      <rect x="44" y="0" width="32" height="34" rx="4" fill="#1b1613"/>
      <rect x="40" y="30" width="40" height="18" rx="3" fill="#c9a961"/>
      <path d="M40 48 C 22 80, 14 110, 14 150 L14 356 Q14 372 30 372 L90 372 Q106 372 106 356 L106 150 C106 110, 98 80, 80 48 Z" fill="url(#bottle2)"/>
      <rect x="28" y="170" width="64" height="110" rx="3" fill="#f3ead9"/>
      <text x="60" y="255" font-family="Yu Mincho, Hiragino Mincho ProN, Noto Serif CJK JP, serif" font-size="26" fill="#1b1613" text-anchor="middle" writing-mode="tb">久保田</text>
    </g>
  </g>

  <!-- Detail card -->
  <g transform="translate(470 80)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="520" height="330" rx="12" fill="#1b1613" stroke="#3a312b"/>
    <text x="28" y="52" font-size="34" font-weight="700" fill="#f5efe4">Dassai 45</text>
    <text x="28" y="80" font-size="16" fill="#c9a961" letter-spacing="2">JUNMAI DAIGINJO · YAMAGUCHI</text>
    <g font-size="14" fill="#b9ad9c">
      <text x="28" y="120">Polishing 45%</text><text x="180" y="120">SMV +3</text><text x="300" y="120">Acidity 1.5</text><text x="420" y="120">15.5%</text>
    </g>
    <!-- aroma radar -->
    <g transform="translate(110 235)">
      <g fill="none" stroke="#3a312b">
        <polygon points="0,-70 61,-35 61,35 0,70 -61,35 -61,-35"/>
        <polygon points="0,-47 41,-23 41,23 0,47 -41,23 -41,-23"/>
        <polygon points="0,-23 20,-12 20,12 0,23 -20,12 -20,-12"/>
      </g>
      <polygon points="0,-62 48,-28 30,17 0,40 -52,30 -40,-20" fill="#c9a961" fill-opacity="0.35" stroke="#c9a961" stroke-width="2"/>
      <g font-size="11" fill="#8d8273" text-anchor="middle">
        <text x="0" y="-80">fruity</text><text x="80" y="-36">floral</text><text x="82" y="46">rice</text><text x="0" y="92">umami</text><text x="-82" y="46">acidity</text><text x="-80" y="-36">dry</text>
      </g>
    </g>
    <!-- pairing + stars -->
    <g transform="translate(240 160)" font-size="14" fill="#b9ad9c">
      <text x="0" y="0" fill="#8d8273" font-size="12" letter-spacing="2">PAIRINGS</text>
      <text x="0" y="26">Sashimi · Oysters · Light cheese</text>
      <text x="0" y="50">Serve chilled, 8–10 °C</text>
      <text x="0" y="90" fill="#8d8273" font-size="12" letter-spacing="2">MY CELLAR</text>
      <text x="0" y="118" fill="#c9a961" font-size="20">★★★★☆</text>
      <text x="0" y="142">Tasted · 2026-06-21</text>
      <rect x="0" y="160" width="86" height="24" rx="12" fill="#c9a961" fill-opacity="0.15" stroke="#c9a961" stroke-opacity="0.5"/><text x="43" y="177" text-anchor="middle" fill="#c9a961" font-size="12">Junmai</text>
      <rect x="96" y="160" width="100" height="24" rx="12" fill="#c9a961" fill-opacity="0.15" stroke="#c9a961" stroke-opacity="0.5"/><text x="146" y="177" text-anchor="middle" fill="#c9a961" font-size="12">Daiginjo</text>
    </g>
  </g>

  <!-- Flashcard -->
  <g transform="translate(470 440)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="380" height="120" rx="12" fill="#1b1613" stroke="#3a312b"/>
    <text x="24" y="34" font-size="12" fill="#8d8273" letter-spacing="2">FLASHCARD · REVIEW DUE TODAY: 12</text>
    <text x="24" y="70" font-size="22" fill="#f5efe4">What does 精米歩合 (seimai buai) mean?</text>
    <g transform="translate(24 88)" font-size="12">
      <rect width="70" height="22" rx="11" fill="#5a2a2a"/><text x="35" y="15" text-anchor="middle" fill="#f5efe4">Again</text>
      <rect x="78" width="70" height="22" rx="11" fill="#4a3d1e"/><text x="113" y="15" text-anchor="middle" fill="#f5efe4">Hard</text>
      <rect x="156" width="70" height="22" rx="11" fill="#2e4a2e"/><text x="191" y="15" text-anchor="middle" fill="#f5efe4">Good</text>
      <rect x="234" width="70" height="22" rx="11" fill="#22403f"/><text x="269" y="15" text-anchor="middle" fill="#f5efe4">Easy</text>
    </g>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="640" font-size="104" font-weight="800" fill="#f5efe4" letter-spacing="-3">Sake Hub</text>
    <rect x="64" y="656" width="200" height="4" fill="#c9a961"/>
    <text x="64" y="690" font-size="22" fill="#b9ad9c" letter-spacing="4">EXPLORE, TASTE, LEARN · OFFLINE</text>
  </g>
</svg>
