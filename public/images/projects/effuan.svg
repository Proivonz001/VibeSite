<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#e10600" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e10600" stop-opacity="0"/>
    </radialGradient>
    <!-- Car sprite from the game: livery layer tinted via currentColor, neutral details on top. -->
    <g id="car">
      <rect x="1" y="3.5" width="6" height="23" rx="1.2" fill="currentColor"/>
      <path d="M19 5.5 L35 4.5 L39 8 L39 22 L35 25.5 L19 24.5 L15.5 20 L15.5 10 Z" fill="currentColor" opacity="0.8"/>
      <path d="M7 12 L19 9 L34 8 L44 10 L47 12 L47 18 L44 20 L34 22 L19 21 L7 18 Z" fill="currentColor"/>
      <path d="M45 11.5 L59 13 L59 17 L45 18.5 Z" fill="currentColor"/>
      <rect x="57" y="1.5" width="6" height="27" rx="1.6" fill="currentColor" opacity="0.9"/>
      <rect x="5" y="0" width="12.5" height="8" rx="3" fill="#17171a"/>
      <rect x="5" y="22" width="12.5" height="8" rx="3" fill="#17171a"/>
      <rect x="42" y="1" width="10.5" height="7.4" rx="3" fill="#17171a"/>
      <rect x="42" y="21.6" width="10.5" height="7.4" rx="3" fill="#17171a"/>
      <rect x="9" y="7.5" width="4" height="15" fill="#00000038"/>
      <rect x="45" y="8" width="3" height="14" fill="#00000038"/>
      <rect x="10" y="13.4" width="34" height="3.2" rx="1.6" fill="#00000026"/>
      <ellipse cx="30.5" cy="15" rx="5.6" ry="4.2" fill="#0e0e11"/>
      <ellipse cx="31.5" cy="15" rx="6.8" ry="5.2" fill="none" stroke="#2c2c31" stroke-width="1.5"/>
      <ellipse cx="36.8" cy="15" rx="1.5" ry="1.5" fill="#2c2c31"/>
    </g>
    <!-- Tyre sprite from the game UI. -->
    <g id="tyre">
      <circle cx="32" cy="32" r="25.5" fill="none" stroke="#20232b" stroke-width="9"/>
      <circle cx="32" cy="32" r="20.5" fill="#12141a"/>
      <g stroke="#2c303a" stroke-width="2.6" stroke-linecap="round">
        <line x1="32" y1="26.5" x2="32" y2="15.5"/>
        <line x1="37.2" y1="30.3" x2="47.7" y2="26.9"/>
        <line x1="35.2" y1="36.4" x2="41.7" y2="45.4"/>
        <line x1="28.8" y1="36.4" x2="22.3" y2="45.4"/>
        <line x1="26.8" y1="30.3" x2="16.3" y2="26.9"/>
      </g>
      <circle cx="32" cy="32" r="5.2" fill="#2c303a"/>
    </g>
    <g id="sun" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round">
      <circle cx="24" cy="24" r="9"/>
      <line x1="24" y1="4" x2="24" y2="9"/><line x1="24" y1="39" x2="24" y2="44"/>
      <line x1="4" y1="24" x2="9" y2="24"/><line x1="39" y1="24" x2="44" y2="24"/>
      <line x1="9.9" y1="9.9" x2="13.4" y2="13.4"/><line x1="34.6" y1="34.6" x2="38.1" y2="38.1"/>
      <line x1="9.9" y1="38.1" x2="13.4" y2="34.6"/><line x1="34.6" y1="13.4" x2="38.1" y2="9.9"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#12141a"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- Big faint tyre and soft compound ring, top right. -->
  <g transform="translate(960 400) scale(5.2)" opacity="0.35">
    <use href="#tyre"/>
    <circle cx="32" cy="32" r="25.5" fill="none" stroke="#e10600" stroke-width="2.2" stroke-dasharray="120 40" opacity="0.9"/>
  </g>

  <!-- Track: kerbs, asphalt, racing line. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="track" d="M -80 780 C 240 780 300 330 560 330 S 900 520 1120 330 S 1380 110 1500 60"/>
    <use href="#track" stroke="#f4f4f4" stroke-width="96"/>
    <use href="#track" stroke="#e10600" stroke-width="96" stroke-dasharray="26 26"/>
    <use href="#track" stroke="#2a2d36" stroke-width="80"/>
    <use href="#track" stroke="#3a3d47" stroke-width="80" stroke-dasharray="1 999" opacity="0"/>
    <use href="#track" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="14 18" opacity="0.18"/>
    <!-- DRS zone marker -->
    <path d="M 560 300 S 900 470 1120 300" fill="none" stroke="#22c55e" stroke-width="3" stroke-dasharray="12 10" opacity="0.5"/>
  </g>

  <!-- Cars (each 64x30 sprite, scaled 2.4x). -->
  <g transform="translate(287 435) rotate(-46) scale(2.4) translate(-32 -15)" color="#ffd200"><use href="#car"/></g>
  <g transform="translate(444 342) rotate(-27) scale(2.4) translate(-32 -15)" color="#1e90ff"><use href="#car"/></g>
  <g transform="translate(758 319) rotate(17) scale(2.4) translate(-32 -15)" color="#e10600"><use href="#car"/></g>
  <g transform="translate(911 388) rotate(5) scale(2.4) translate(-32 -15)" color="#00c2a8"><use href="#car"/></g>
  <g transform="translate(1293 148) rotate(-36) scale(2.4) translate(-32 -15)" color="#ff7a00"><use href="#car"/></g>

  <!-- Timing tower fragment. -->
  <g transform="translate(1000 540)" font-family="Titillium Web, Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cfd2da">
    <rect x="-16" y="-20" width="240" height="140" rx="10" fill="#0e1015" stroke="#262a33"/>
    <text x="0" y="4" font-size="14" fill="#8a8f9c" letter-spacing="2">LAP 12 / 25</text>
    <g font-size="17">
      <rect x="0" y="18" width="4" height="16" fill="#e10600"/><text x="14" y="32">DEL</text><text x="140" y="32" fill="#8a8f9c">LEADER</text>
      <rect x="0" y="46" width="4" height="16" fill="#1e90ff"/><text x="14" y="60">STE</text><text x="140" y="60" fill="#8a8f9c">+0.6</text>
      <rect x="0" y="74" width="4" height="16" fill="#ffd200"/><text x="14" y="88">KOV</text><text x="140" y="88" fill="#22c55e">+1.2 DRS</text>
    </g>
  </g>

  <!-- Weather -->
  <g transform="translate(60 250)" opacity="0.7"><use href="#sun" transform="scale(1.2)"/></g>
  <text x="130" y="288" font-family="Titillium Web, Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8a8f9c" letter-spacing="1">DRY · TRACK 28°</text>

  <!-- Title -->
  <g font-family="Titillium Web, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="170" font-size="132" font-weight="800" fill="#ffffff" letter-spacing="-3">EFFUAN</text>
    <rect x="64" y="186" width="230" height="4" fill="#e10600"/>
    <text x="64" y="220" font-size="22" fill="#b3b7c2" letter-spacing="4">MINIMALIST F1 MANAGEMENT</text>
  </g>
</svg>
