<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f10"/><stop offset="1" stop-color="#2a1418"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Toolbar -->
  <g transform="translate(60 60)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#f5f5f4">
    <rect width="560" height="52" rx="12" fill="#2b1c1f" stroke="#4a2f34"/>
    <g transform="translate(16 12)">
      <rect width="72" height="28" rx="6" fill="#e11d48"/><text x="36" y="19" text-anchor="middle" font-weight="600">Text</text>
      <rect x="84" width="88" height="28" rx="6" fill="#3a262b"/><text x="128" y="19" text-anchor="middle">Edit ✎</text>
      <rect x="184" width="92" height="28" rx="6" fill="#3a262b"/><text x="230" y="19" text-anchor="middle">Highlight</text>
      <rect x="288" width="80" height="28" rx="6" fill="#3a262b"/><text x="328" y="19" text-anchor="middle">Pen</text>
      <rect x="380" width="72" height="28" rx="6" fill="#3a262b"/><text x="416" y="19" text-anchor="middle">OCR</text>
      <rect x="464" width="64" height="28" rx="6" fill="#3a262b"/><text x="496" y="19" text-anchor="middle">Save</text>
    </g>
  </g>

  <!-- Page -->
  <g transform="translate(700 50)" filter="url(#shadow)">
    <rect width="440" height="560" rx="6" fill="#fafaf9"/>
    <rect x="40" y="44" width="220" height="16" rx="3" fill="#1c1917"/>
    <rect x="40" y="80" width="360" height="8" rx="4" fill="#a8a29e"/>
    <rect x="40" y="98" width="340" height="8" rx="4" fill="#a8a29e"/>
    <rect x="40" y="116" width="355" height="8" rx="4" fill="#a8a29e"/>
    <!-- edited line: editable box with caret -->
    <rect x="34" y="130" width="300" height="24" rx="4" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="4 3"/>
    <rect x="40" y="138" width="230" height="8" rx="4" fill="#57534e"/>
    <rect x="274" y="134" width="2" height="16" fill="#e11d48"/>
    <rect x="40" y="170" width="330" height="8" rx="4" fill="#a8a29e"/>
    <!-- highlight -->
    <rect x="36" y="184" width="240" height="18" fill="#facc15" fill-opacity="0.55"/>
    <rect x="40" y="188" width="300" height="8" rx="4" fill="#a8a29e"/>
    <rect x="40" y="206" width="280" height="8" rx="4" fill="#a8a29e"/>
    <!-- image block -->
    <rect x="40" y="240" width="160" height="110" rx="4" fill="#d6d3d1"/>
    <polygon points="60,330 110,270 150,310 170,290 190,330" fill="#a8a29e"/>
    <circle cx="80" cy="265" r="10" fill="#f5f5f4"/>
    <!-- table -->
    <g stroke="#d6d3d1"><rect x="220" y="240" width="180" height="110" fill="none"/><line x1="220" y1="268" x2="400" y2="268"/><line x1="220" y1="296" x2="400" y2="296"/><line x1="220" y1="324" x2="400" y2="324"/><line x1="310" y1="240" x2="310" y2="350"/></g>
    <rect x="40" y="380" width="360" height="8" rx="4" fill="#a8a29e"/>
    <rect x="40" y="398" width="320" height="8" rx="4" fill="#a8a29e"/>
    <!-- pen stroke -->
    <path d="M60 470 C 120 430, 160 510, 230 460 S 330 440, 380 480" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
    <!-- OCR scan line -->
    <rect x="0" y="500" width="440" height="3" fill="#e11d48" opacity="0.8"/>
    <text x="40" y="540" font-family="Consolas, Menlo, monospace" font-size="12" fill="#57534e">OCR · text layer added · 1 of 3 pages</text>
  </g>

  <!-- Local-only badge -->
  <g transform="translate(60 150)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="350" height="40" rx="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="175" y="26" font-size="16" fill="#86efac" text-anchor="middle" letter-spacing="2">NOTHING LEAVES YOUR BROWSER</text>
  </g>
  <!-- WASM engines -->
  <g transform="translate(60 220)" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#d6d3d1">
    <rect width="150" height="34" rx="8" fill="#2b1c1f" stroke="#4a2f34"/><text x="75" y="22" text-anchor="middle">MuPDF · WASM</text>
    <rect x="162" width="110" height="34" rx="8" fill="#2b1c1f" stroke="#4a2f34"/><text x="217" y="22" text-anchor="middle">pdf-lib</text>
    <rect x="284" width="150" height="34" rx="8" fill="#2b1c1f" stroke="#4a2f34"/><text x="359" y="22" text-anchor="middle">Tesseract OCR</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="620" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">PDF Editor</text>
    <text x="64" y="670" font-size="22" fill="#b3b7c2" letter-spacing="4">EDIT, ANNOTATE AND OCR, OFFLINE</text>
  </g>
</svg>
