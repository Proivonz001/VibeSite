      <use href="#tileB" x="-1080" y="570"/><use href="#tileA" x="-960" y="570"/><use href="#tileB" x="-840" y="570"/><use href="#tileA" x="-720" y="570"/><use href="#tileB" x="-600" y="570"/><use href="#tileA" x="-480" y="570"/><use href="#tileB" x="-360" y="570"/><use href="#tileA" x="-240" y="570"/><use href="#tileB" x="-120" y="570"/><use href="#tileA" x="0" y="570"/><use href="#tileB" x="120" y="570"/><use href="#tileA" x="240" y="570"/><use href="#tileB" x="360" y="570"/><use href="#tileA" x="480" y="570"/><use href="#tileB" x="600" y="570"/><use href="#tileA" x="720" y="570"/><use href="#tileB" x="840" y="570"/><use href="#tileA" x="960" y="570"/>
      <use href="#tileA" x="-1020" y="600"/><use href="#tileB" x="-900" y="600"/><use href="#tileA" x="-780" y="600"/><use href="#tileB" x="-660" y="600"/><use href="#tileA" x="-540" y="600"/><use href="#tileB" x="-420" y="600"/><use href="#tileA" x="-300" y="600"/><use href="#tileB" x="-180" y="600"/><use href="#tileA" x="-60" y="600"/><use href="#tileB" x="60" y="600"/><use href="#tileA" x="180" y="600"/><use href="#tileB" x="300" y="600"/><use href="#tileA" x="420" y="600"/><use href="#tileB" x="540" y="600"/><use href="#tileA" x="660" y="600"/><use href="#tileB" x="780" y="600"/><use href="#tileA" x="900" y="600"/>
