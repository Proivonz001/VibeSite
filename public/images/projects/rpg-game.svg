  <!-- Back wall (stone blocks) -->
  <g transform="translate(160 210)">
    <g fill="#9ca3af" stroke="#4b5563" stroke-width="2">
      <rect x="0" y="0" width="120" height="50" rx="4"/><rect x="128" y="0" width="120" height="50" rx="4"/><rect x="256" y="0" width="120" height="50" rx="4"/><rect x="384" y="0" width="120" height="50" rx="4"/><rect x="512" y="0" width="120" height="50" rx="4"/><rect x="640" y="0" width="120" height="50" rx="4"/><rect x="768" y="0" width="120" height="50" rx="4"/>
      <rect x="-64" y="58" width="120" height="50" rx="4"/><rect x="64" y="58" width="120" height="50" rx="4"/><rect x="192" y="58" width="120" height="50" rx="4"/><rect x="320" y="58" width="120" height="50" rx="4"/><rect x="448" y="58" width="120" height="50" rx="4"/><rect x="576" y="58" width="120" height="50" rx="4"/><rect x="704" y="58" width="120" height="50" rx="4"/><rect x="832" y="58" width="120" height="50" rx="4"/>
    </g>
  </g>

  <!-- Vision cones and enemies -->
  <g transform="translate(300 400)"><use href="#cone"/><use href="#orc"/></g>
  <g transform="translate(980 380) rotate(180)"><use href="#cone"/></g><g transform="translate(980 380)"><use href="#crab"/></g>
  <g transform="translate(760 372)"><use href="#bee"/></g>
  <g transform="translate(1100 330)"><use href="#tree"/></g>
  <g transform="translate(200 300)"><use href="#tree"/></g>

  <!-- Hero, sneaking behind the orc -->
  <g transform="translate(640 470)"><use href="#hero"/></g>
  <text x="640" y="415" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#facc15" text-anchor="middle" letter-spacing="2">SNEAKING · CRIT READY</text>

  <rect y="460" width="1280" height="260" fill="url(#fade)"/>

  <!-- HUD -->
  <g transform="translate(60 60)">
    <rect width="300" height="16" rx="8" fill="#3b0d0d"/><rect width="210" height="16" rx="8" fill="#dc2626"/>
    <rect y="24" width="300" height="12" rx="6" fill="#0d3b1a"/><rect y="24" width="260" height="12" rx="6" fill="#22c55e"/>
    <text x="0" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#cbd5e1" letter-spacing="2">HP 70 · STAMINA 87</text>
  </g>
  <text x="1220" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="end" letter-spacing="2">ROOM 1 · MEADOW</text>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="640" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Room Rogue</text>
    <rect x="64" y="656" width="200" height="4" fill="#22c55e"/>
    <text x="64" y="690" font-size="22" fill="#cbd5e1" letter-spacing="4">STEALTH ROGUELITE, ONE ROOM AT A TIME</text>
