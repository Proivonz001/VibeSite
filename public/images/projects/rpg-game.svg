<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1410"/><stop offset="1" stop-color="#13231a"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.6"/>
    </linearGradient>
    <!-- isometric-ish floor tile -->
    <g id="tileA"><polygon points="0,0 60,-30 120,0 60,30" fill="#3f6b3a"/></g>
    <g id="tileB"><polygon points="0,0 60,-30 120,0 60,30" fill="#4a7a44"/></g>
    <!-- vision cone -->
    <g id="cone"><path d="M0 0 L150 -60 A160 160 0 0 1 150 60 Z" fill="#facc15" fill-opacity="0.18"/></g>
    <!-- characters (blocky, Kenney-like) -->
    <g id="hero">
      <ellipse cx="0" cy="32" rx="22" ry="8" fill="#000" fill-opacity="0.35"/>
      <rect x="-14" y="-6" width="28" height="34" rx="6" fill="#c2410c"/>
      <rect x="-12" y="-34" width="24" height="26" rx="6" fill="#f2c9a0"/>
      <rect x="-13" y="-38" width="26" height="10" rx="4" fill="#5b3a1e"/>
      <rect x="14" y="0" width="24" height="6" rx="2" fill="#94a3b8" transform="rotate(-25 14 3)"/>
    </g>
    <g id="orc">
      <ellipse cx="0" cy="32" rx="24" ry="8" fill="#000" fill-opacity="0.35"/>
      <rect x="-16" y="-8" width="32" height="36" rx="6" fill="#3f6212"/>
      <rect x="-14" y="-36" width="28" height="28" rx="6" fill="#65a30d"/>
      <rect x="-8" y="-24" width="4" height="4" fill="#111"/><rect x="4" y="-24" width="4" height="4" fill="#111"/>
      <rect x="16" y="-12" width="8" height="30" rx="2" fill="#78350f"/>
    </g>
    <g id="crab">
      <ellipse cx="0" cy="22" rx="26" ry="7" fill="#000" fill-opacity="0.35"/>
      <ellipse cx="0" cy="8" rx="24" ry="14" fill="#dc2626"/>
      <circle cx="-8" cy="0" r="3" fill="#111"/><circle cx="8" cy="0" r="3" fill="#111"/>
      <path d="M-24 6 l-12 -12 M24 6 l12 -12" stroke="#dc2626" stroke-width="6" stroke-linecap="round"/>
    </g>
    <g id="bee">
      <ellipse cx="0" cy="26" rx="14" ry="5" fill="#000" fill-opacity="0.35"/>
      <ellipse cx="0" cy="0" rx="14" ry="10" fill="#facc15"/>
      <rect x="-6" y="-10" width="4" height="20" fill="#111"/><rect x="4" y="-10" width="4" height="20" fill="#111"/>
      <ellipse cx="-8" cy="-12" rx="8" ry="5" fill="#e0f2fe" fill-opacity="0.8"/><ellipse cx="8" cy="-12" rx="8" ry="5" fill="#e0f2fe" fill-opacity="0.8"/>
    </g>
    <g id="tree">
      <rect x="-6" y="0" width="12" height="22" fill="#78350f"/>
      <polygon points="0,-60 -30,0 30,0" fill="#15803d"/>
      <polygon points="0,-80 -22,-30 22,-30" fill="#16a34a"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>

