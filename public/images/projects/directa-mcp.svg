<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Price line with area -->
  <path d="M60 520 L180 470 L300 500 L420 380 L540 410 L660 300 L780 340 L900 220 L1020 260 L1140 150 L1220 180 L1220 720 L60 720 Z" fill="url(#area)"/>
  <path d="M60 520 L180 470 L300 500 L420 380 L540 410 L660 300 L780 340 L900 220 L1020 260 L1140 150 L1220 180" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Candles -->
  <g stroke-width="3">
    <g stroke="#ef4444" fill="#ef4444"><line x1="720" y1="380" x2="720" y2="470"/><rect x="708" y="400" width="24" height="50" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="780" y1="330" x2="780" y2="440"/><rect x="768" y="350" width="24" height="60" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="840" y1="290" x2="840" y2="400"/><rect x="828" y="310" width="24" height="70" rx="2"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="900" y1="300" x2="900" y2="380"/><rect x="888" y="320" width="24" height="40" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="960" y1="230" x2="960" y2="360"/><rect x="948" y="250" width="24" height="80" rx="2"/></g>
  </g>

  <!-- Plug / MCP glyph -->
  <g transform="translate(1040 60)" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M40 40 v40 M100 40 v40"/>
    <path d="M20 80 h100 v20 a50 50 0 0 1 -100 0 z"/>
    <path d="M70 150 v40"/>
  </g>

  <!-- Read-only badge -->
  <g transform="translate(60 60)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="220" height="40" rx="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="110" y="26" font-size="17" fill="#86efac" text-anchor="middle" letter-spacing="2">READ-ONLY BY DEFAULT</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="620" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Directa MCP</text>
    <text x="64" y="670" font-size="22" fill="#b3b7c2" letter-spacing="4">YOUR BROKER ACCOUNT, INSIDE CLAUDE</text>
  </g>
</svg>
