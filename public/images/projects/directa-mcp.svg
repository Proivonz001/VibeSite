<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/><stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#grid)"/>

  <!-- Price line with area -->
  <path d="M60 520 L180 470 L300 500 L420 380 L540 410 L660 300 L780 340 L900 220 L1020 260 L1140 150 L1220 180 L1220 720 L60 720 Z" fill="url(#area)"/>
  <path d="M60 520 L180 470 L300 500 L420 380 L540 410 L660 300 L780 340 L900 220 L1020 260 L1140 150 L1220 180" fill="none" stroke="#22c55e" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Candles: a zoomed-in detail of the series, in the empty area above the line's left leg -->
  <g stroke-width="3">
    <g stroke="#ef4444" fill="#ef4444"><line x1="140" y1="300" x2="140" y2="400"/><rect x="128" y="320" width="24" height="56" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="200" y1="270" x2="200" y2="380"/><rect x="188" y="290" width="24" height="64" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="260" y1="230" x2="260" y2="340"/><rect x="248" y="250" width="24" height="70" rx="2"/></g>
    <g stroke="#ef4444" fill="#ef4444"><line x1="320" y1="240" x2="320" y2="330"/><rect x="308" y="262" width="24" height="46" rx="2"/></g>
    <g stroke="#22c55e" fill="#22c55e"><line x1="380" y1="170" x2="380" y2="300"/><rect x="368" y="190" width="24" height="84" rx="2"/></g>
  </g>
  <text x="140" y="440" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#7c8aa5" letter-spacing="2">ENI · 15m</text>

  <!-- Plug / MCP glyph -->
  <g transform="translate(1080 330)" fill="none" stroke="#a5b4fc" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M40 40 v40 M100 40 v40"/>
    <path d="M20 80 h100 v20 a50 50 0 0 1 -100 0 z"/>
    <path d="M70 150 v40"/>
  </g>

  <!-- Read-only badge -->
  <g transform="translate(60 60)" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect width="220" height="40" rx="20" fill="#22c55e" fill-opacity="0.15" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="110" y="26" font-size="17" fill="#86efac" text-anchor="middle" letter-spacing="2">READ-ONLY BY DEFAULT</text>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="60" y="620" font-size="104" font-weight="800" fill="#ffffff" letter-spacing="-3">Directa MCP</text>
    <text x="64" y="670" font-size="22" fill="#b3b7c2" letter-spacing="4">YOUR BROKER ACCOUNT, INSIDE CLAUDE</text>
  </g>
</svg>
